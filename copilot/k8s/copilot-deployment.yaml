---
# =============================================================================
# AION Copilot — Kubernetes Deployment
# =============================================================================
# FastAPI service with Qdrant, LLM, and Trino integration
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: aion-copilot
  labels:
    app.kubernetes.io/part-of: aion
    app.kubernetes.io/component: ai-copilot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aion-copilot

  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/aion-production-copilot
---
# Copilot FastAPI
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aion-copilot

  labels:
    app: aion-copilot
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aion-copilot
  template:
    metadata:
      labels:
        app: aion-copilot
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: aion-copilot
      containers:
        - name: copilot
          image: aion-copilot:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            # Qdrant
            - name: QDRANT_HOST
              value: "qdrant.aion-mlops.svc.cluster.local"
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_COLLECTION
              value: "aion_business_context"
            # Trino
            - name: TRINO_HOST
              value: "trino-coordinator.aion-analytics.svc.cluster.local"
            - name: TRINO_PORT
              value: "8080"
            - name: TRINO_USER
              value: "aion-copilot"
            - name: TRINO_CATALOG
              value: "awsdatacatalog"
            - name: TRINO_SCHEMA
              value: "gold"
            # LLM (from secrets)
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aion-llm-keys
                  key: anthropic-api-key
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aion-llm-keys
                  key: openai-api-key
                  optional: true
            - name: DEFAULT_LLM
              value: "claude"
            # Guardrails
            - name: GUARDRAIL_ENABLED
              value: "true"
            - name: PII_DETECTION_ENABLED
              value: "true"
            - name: SQL_INJECTION_BLOCK
              value: "true"
            # AWS
            - name: AWS_DEFAULT_REGION
              value: "eu-west-1"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aion-copilot

spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      name: http
  selector:
    app: aion-copilot
---
# HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aion-copilot-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aion-copilot
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
---
# PDB
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aion-copilot-pdb

spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: aion-copilot
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aion-copilot

  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - copilot.aion.internal
      secretName: aion-copilot-tls
  rules:
    - host: copilot.aion.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aion-copilot
                port:
                  number: 8000
