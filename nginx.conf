server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /graphql {
        proxy_pass http://gateway.aion.svc.cluster.local:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /copilot {
        proxy_pass http://aion-copilot.aion-copilot.svc.cluster.local:8000;
        proxy_set_header Host $host;
    }
}
