version: "3.9"

# =============================================================================
# AION Ingestion Layer — Local Development Stack
# =============================================================================

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.6.0
  depends_on:
    zookeeper:
      condition: service_healthy
    kafka:
      condition: service_healthy
  environment: &kafka-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_SECURITY_PROTOCOL: PLAINTEXT

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    hostname: zookeeper
    container_name: aion-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    container_name: aion-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ---------------------------------------------------------------------------
  # Legacy Database (CDC Source)
  # ---------------------------------------------------------------------------

  legacy-postgres:
    image: postgres:16-alpine
    hostname: legacy-postgres
    container_name: aion-legacy-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: legacy
      POSTGRES_USER: legacy_admin
      POSTGRES_PASSWORD: legacy_secret_2024
    volumes:
      - legacy-pg-data:/var/lib/postgresql/data
      - ./init-legacy-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacy_admin -d legacy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Debezium (CDC Connector)
  # ---------------------------------------------------------------------------

  debezium:
    image: debezium/connect:2.5.Final
    hostname: debezium
    container_name: aion-debezium
    depends_on:
      kafka:
        condition: service_healthy
      legacy-postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: aion-debezium-connect
      CONFIG_STORAGE_TOPIC: debezium-configs
      OFFSET_STORAGE_TOPIC: debezium-offsets
      STATUS_STORAGE_TOPIC: debezium-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Apache Flink (Stateful Processing)
  # ---------------------------------------------------------------------------

  flink-jobmanager:
    image: aion-flink-jobmanager:latest
    build:
      context: ../flink
      dockerfile: Dockerfile
    hostname: flink-jobmanager
    container_name: aion-flink-jobmanager
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"   # Web UI
      - "6123:6123"   # RPC
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 2048m
        taskmanager.memory.process.size: 4096m
        taskmanager.numberOfTaskSlots: 4
        state.backend: rocksdb
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        state.savepoints.dir: file:///tmp/flink-savepoints
        execution.checkpointing.interval: 60000
        execution.checkpointing.min-pause: 30000
        restart-strategy: exponential-delay
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: jobmanager
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-savepoints:/tmp/flink-savepoints

  flink-taskmanager:
    image: aion-flink-jobmanager:latest
    build:
      context: ../flink
      dockerfile: Dockerfile
    hostname: flink-taskmanager
    container_name: aion-flink-taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 2048m
        taskmanager.memory.process.size: 4096m
        taskmanager.numberOfTaskSlots: 4
        state.backend: rocksdb
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        state.savepoints.dir: file:///tmp/flink-savepoints
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: taskmanager
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - flink-savepoints:/tmp/flink-savepoints

  # ---------------------------------------------------------------------------
  # Apache Spark (Bronze → Silver Pipeline)
  # ---------------------------------------------------------------------------

  spark-master:
    image: bitnami/spark:3.5.1
    hostname: spark-master
    container_name: aion-spark-master
    ports:
      - "8082:8080"   # Spark UI
      - "7077:7077"   # Spark Master port
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    volumes:
      - spark-data:/opt/bitnami/spark/data

  spark-worker:
    image: bitnami/spark:3.5.1
    hostname: spark-worker
    container_name: aion-spark-worker
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 4G
      SPARK_WORKER_CORES: 2
    volumes:
      - spark-data:/opt/bitnami/spark/data

  # ---------------------------------------------------------------------------
  # Schema Registry
  # ---------------------------------------------------------------------------

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    hostname: schema-registry
    container_name: aion-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8084:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # ---------------------------------------------------------------------------
  # UI & Debugging
  # ---------------------------------------------------------------------------

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    container_name: aion-kafka-ui
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "9090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aion-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  legacy-pg-data:
  flink-checkpoints:
  flink-savepoints:
  spark-data:
