---
# IRSA-bound Service Accounts for Ingestion Layer
# These SAs have AWS IAM roles attached via EKS IRSA

apiVersion: v1
kind: ServiceAccount
metadata:
  name: aion-kafka
  namespace: aion-ingestion
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/aion-production-msk-access
  labels:
    app.kubernetes.io/name: aion-kafka
    app.kubernetes.io/component: ingestion
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aion-s3
  namespace: aion-ingestion
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/aion-production-s3-access
  labels:
    app.kubernetes.io/name: aion-s3
    app.kubernetes.io/component: ingestion
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aion-rds
  namespace: aion-ingestion
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/aion-production-rds-access
  labels:
    app.kubernetes.io/name: aion-rds
    app.kubernetes.io/component: ingestion
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aion-generic
  namespace: aion-ingestion
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/aion-production-generic-access
  labels:
    app.kubernetes.io/name: aion-generic
    app.kubernetes.io/component: ingestion
