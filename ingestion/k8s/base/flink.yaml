---
# Flink JobManager
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: aion-ingestion
  labels:
    app: flink
    component: jobmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
    spec:
      serviceAccountName: aion-generic
      containers:
        - name: jobmanager
          image: aion-flink-jobmanager:latest
          args: ["jobmanager"]
          ports:
            - containerPort: 6123
              name: rpc
            - containerPort: 8081
              name: ui
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-jobmanager
                jobmanager.memory.process.size: 2048m
                taskmanager.memory.process.size: 4096m
                taskmanager.numberOfTaskSlots: 4
                state.backend: rocksdb
                state.checkpoints.dir: s3a://aion-flink-state/checkpoints
                state.savepoints.dir: s3a://aion-flink-state/savepoints
                execution.checkpointing.interval: 60000
                execution.checkpointing.mode: EXACTLY_ONCE
                restart-strategy.type: exponential-delay
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-cluster.aion-data.svc.cluster.local:9092"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          volumeMounts:
            - name: flink-checkpoints
              mountPath: /tmp/flink-checkpoints
            - name: flink-savepoints
              mountPath: /tmp/flink-savepoints
      volumes:
        - name: flink-checkpoints
          emptyDir: {}
        - name: flink-savepoints
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: aion-ingestion
  labels:
    app: flink
    component: jobmanager
spec:
  ports:
    - port: 6123
      targetPort: rpc
      name: rpc
    - port: 8081
      targetPort: ui
      name: ui
  selector:
    app: flink
    component: jobmanager
---
# Flink TaskManager
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: aion-ingestion
  labels:
    app: flink
    component: taskmanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flink
      component: taskmanager
  template:
    metadata:
      labels:
        app: flink
        component: taskmanager
    spec:
      serviceAccountName: aion-generic
      containers:
        - name: taskmanager
          image: aion-flink-jobmanager:latest
          args: ["taskmanager"]
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-jobmanager
                jobmanager.memory.process.size: 2048m
                taskmanager.memory.process.size: 4096m
                taskmanager.numberOfTaskSlots: 4
                state.backend: rocksdb
                state.checkpoints.dir: s3a://aion-flink-state/checkpoints
                state.savepoints.dir: s3a://aion-flink-state/savepoints
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-cluster.aion-data.svc.cluster.local:9092"
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "5Gi"
          volumeMounts:
            - name: flink-checkpoints
              mountPath: /tmp/flink-checkpoints
            - name: flink-savepoints
              mountPath: /tmp/flink-savepoints
      volumes:
        - name: flink-checkpoints
          emptyDir: {}
        - name: flink-savepoints
          emptyDir: {}
---
# PodDisruptionBudget for TaskManager
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flink-taskmanager-pdb
  namespace: aion-ingestion
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: flink
      component: taskmanager
